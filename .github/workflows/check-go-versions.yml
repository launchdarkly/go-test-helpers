name: Check Supported Go Versions
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check-go-versions:
    # The called workflow narrows check-go-eol to `contents: read`; a reusable workflow
    # cannot grant itself more than the caller does, which is why the write scopes are here.
    permissions:
      contents: write
      pull-requests: write
    # TODO(before merge): change back to @main. Pinned to the branch of
    # launchdarkly/gh-actions#113 so this can be dispatched and observed before that PR
    # merges; @main does not contain the workflow yet.
    uses: launchdarkly/gh-actions/.github/workflows/sdk-go-versions.yml@feat/go-eol-versions-action
    with:
      branches: '["main"]'
